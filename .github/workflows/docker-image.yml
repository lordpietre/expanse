name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Test Only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: test-build
          outputs: type=docker
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/expanse:${{ github.event.pull_request.head.sha || github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/expanse:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-old-tags:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Delete stale sha tags from Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST -d "{\"username\":\"${DOCKER_USERNAME}\",\"password\":\"${DOCKER_PASSWORD}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          API="https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/expanse/tags"
          TAGS=$(curl -s -H "Authorization: JWT ${TOKEN}" "${API}?page_size=100" | jq -r '.results[]?.name')
          KEEP=$(echo "${TAGS}" | grep -E '^[0-9a-f]{40}$' | head -10)
          for tag in ${TAGS}; do
            if echo "${tag}" | grep -qE '^[0-9a-f]{40}$' && ! echo "${KEEP}" | grep -qx "${tag}"; then
              echo "Deleting stale tag: ${tag}"
              curl -s -X DELETE -H "Authorization: JWT ${TOKEN}" "${API}/${tag}" -o /dev/null -w "  -> %{http_code}\n"
            fi
          done